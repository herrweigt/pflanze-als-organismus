<script>
var SAMPLES={};
var Q={
/* Kapitel 1 */
q_naehr:{sec:'org',t:'Der Mensch hat einen Verdauungsapparat, damit er Nährstoffe bekommt. Woher bekommt eine Pflanze ihre Nährstoffe (Zucker)?',o:['Sie stellt den Zucker in den Blättern selbst her.','Sie nimmt fertigen Zucker mit der Wurzel aus der Erde auf.','Sie frisst kleine Tiere, die auf ihre Blätter fallen.','Sie bekommt den Zucker aus dem Gießwasser.'],c:0,exp:'Mit Licht, Wasser und Kohlenstoffdioxid stellt sie Zucker her: Fotosynthese.',tip:'Die Erde liefert Wasser und Mineralsalze, aber keinen Zucker. Den Zucker stellt die Pflanze in den grünen Blättern selbst her (Fotosynthese).'},
q_wurzel:{sec:'org',t:'Welche zwei Aufgaben hat die Wurzel?',o:['Verankern und Wasser mit Mineralsalzen aufnehmen','Zucker herstellen und Wasser aus dem Boden aufnehmen','Verankern und die Blüten und Früchte tragen','Wasser verdunsten und Licht für die Blätter sammeln'],c:0,tip:'Zucker entsteht nur in grünen Teilen mit Licht, die Wurzel ist im dunklen Boden. Die Wurzel hält die Pflanze fest und nimmt Wasser mit Mineralsalzen auf.'},
q_spross:{sec:'org',t:'Was macht die Sprossachse (der Stängel)?',o:['Sie trägt Blätter, Blüten und leitet Stoffe.','Sie nimmt das Wasser direkt aus dem Boden auf.','Sie stellt den meisten Zucker der Pflanze her.','Sie bildet nach der Bestäubung die Samen.'],c:0,tip:'Wasser nimmt die Wurzel auf, Zucker entsteht vor allem im Blatt. Die Sprossachse ist Stütze und „Leitung“ dazwischen.'},
q_blatt:{sec:'org',t:'Warum nennt man ein grünes Blatt auch „Nährstofffabrik“?',o:['Dort entsteht mithilfe von Licht Zucker.','Dort werden Nährstoffe aus der Erde gesammelt.','Dort wird der Zucker aus der Wurzel verbraucht.','Dort wird Wasser zu Mineralsalzen umgewandelt.'],c:0,tip:'Im Blatt läuft die Fotosynthese: Aus Wasser und Kohlenstoffdioxid entsteht mit Licht Zucker.'},
q_bluete:{sec:'org',t:'Wozu dient die Blüte?',o:['Fortpflanzung: Es entstehen Frucht und Samen.','Sie lockt Insekten an, um sie zu verdauen.','Sie verdunstet das meiste Wasser der Pflanze.','Sie speichert Zucker für den Winter.'],c:0,tip:'Insekten bestäuben die Blüte, danach entstehen Frucht und Samen. Das ist Fortpflanzung.'},
q_tr1:{sec:'tr',t:'In welche Richtung fließt das Wasser in der Pflanze?',o:['Von der Wurzel über den Spross ins Blatt','Von den Blättern über den Spross zur Wurzel','Vom Regen über die Blätter in den Spross','Je nach Wetter mal nach oben, mal nach unten'],c:0,tip:'Die Wurzel nimmt das Wasser auf, die Blätter verdunsten es. Also fließt es von unten nach oben.'},
q_tr2:{sec:'tr',t:'Wodurch wird das Wasser in der Pflanze nach oben gezogen?',o:['Verdunstung an den Blättern erzeugt Sog.','Die Wurzel pumpt es wie ein Herz nach oben.','Die Sonne zieht das Wasser direkt nach oben.','Die Blüte saugt das Wasser mit dem Nektar an.'],c:0,tip:'Pflanzen haben keine Pumpe. Weil oben an den Blättern Wasser verdunstet, wird von unten Wasser nachgezogen, wie bei einem Strohhalm.'},
q_tr3:{sec:'tr',t:'Wohin wird der Zucker aus den Blättern transportiert?',o:['Zu nicht grünen Teilen wie Wurzel und Blüte','Nur in die Blüte, weil sie am meisten braucht','In den Boden, damit die Erde gedüngt wird','Nirgendwohin, er bleibt im Blatt'],c:0,tip:'Wurzel, Blüte und Früchte können keinen Zucker herstellen. Sie bekommen ihn über den Spross aus den Blättern.'},
q_sim1:{sec:'tr',t:'Licht aus: Was passiert in der Pflanze?',o:['Kein Zucker mehr, Wurzel und Blüte hungern.','Es kommt kein Wasser mehr in den Blättern an.','Die Pflanze macht im Dunkeln mehr Zucker.','Die Wurzel stellt jetzt selbst Zucker her.'],c:0,tip:'Ohne Licht keine Fotosynthese. Wasser kommt zwar oben an, aber Zucker entsteht nicht mehr.'},
q_sim2:{sec:'tr',t:'Wurzelhaare weg: Warum stellt das Blatt dann auch keinen Zucker mehr her?',o:['Ohne Wasser gibt es keine Fotosynthese.','Die Wurzelhaare stellen den Zucker eigentlich her.','Ohne Wurzelhaare kommt kein Licht an das Blatt.','Das Blatt braucht Erde, um Zucker zu bilden.'],c:0,tip:'Für die Fotosynthese braucht das Blatt Wasser. Das kommt nur über die Wurzelhaare in die Pflanze.'},
q_sim3:{sec:'tr',t:'Spross durchtrennt: Was fällt aus?',o:['Wasser nach oben und Zucker nach unten','Nur das Wasser nach oben','Nur der Zucker nach unten','Gar nichts, Blätter versorgen sich selbst'],c:0,tip:'Der Spross ist die Leitung in beide Richtungen. Ist sie unterbrochen, kommt weder Wasser oben noch Zucker unten an.'},
q_kc1:{sec:'org',t:'Eine Kartoffel ist eine verdickte …',o:['Sprossknolle','Wurzelknolle','Frucht','Samenkapsel'],c:0,tip:'Die „Augen“ der Kartoffel sind Knospen, aus denen neue Triebe wachsen. Knospen gibt es nur am Spross, deshalb ist die Kartoffel eine Sprossknolle.'},
q_kc2:{sec:'tr',t:'Gießt man eine Topfpflanze mit Wasser, das blau gefärbt ist, werden nach einiger Zeit die Blattadern blau. Was zeigt das?',o:['Wasser wird von der Wurzel ins Blatt geleitet.','Blätter nehmen Farbe direkt aus der Luft auf.','Der Zucker im Blatt färbt sich mit der Zeit blau.','Die Blüte gibt die blaue Farbe an das Blatt ab.'],c:0,tip:'Das gefärbte Wasser ist über die Wurzel und die Leitelemente im Spross nach oben bis in die Blätter gewandert.'},
q_dia1:{sec:'ver',t:'Wann gibt die Pflanze am meisten Wasser ab?',o:['Am Nachmittag (ca. 14 Uhr)','Um Mitternacht (ca. 24 Uhr)','Am frühen Morgen (ca. 6 Uhr)','Den ganzen Tag gleich viel'],c:0,tip:'Lies den höchsten Punkt der gestrichelten Kurve ab und schau senkrecht nach unten auf die Uhrzeit.'},
q_dia2:{sec:'ver',t:'Warum steigt die Wasseraufnahme erst etwas später an als die Wasserabgabe?',o:['Erst die Verdunstung zieht Wasser nach.','Die Wurzel wacht morgens später auf.','Die Pflanze nimmt nur nachts Wasser auf.','Das Wasser muss im Boden erst warm werden.'],c:0,tip:'Zuerst verdunstet oben Wasser. Dadurch entsteht der Sog, der unten Wasser nachzieht. Deshalb folgt die Aufnahme der Abgabe.'},
q_dia3:{sec:'ver',t:'Warum gibt die Pflanze nachts nur wenig Wasser ab?',o:['Es ist dunkel und kühl, es verdunstet wenig.','Nachts hat die Pflanze kein Wasser mehr.','Nachts schläft die Pflanze und braucht nichts.','Nachts wird das Wasser zu Zucker umgebaut.'],c:0,tip:'Bei Wärme und Licht verdunstet viel Wasser, nachts ist es kühl und dunkel. Pflanzen „schlafen“ nicht wie wir.'},
q_v1:{sec:'ver',t:'Welche Hypothese (Vermutung) wird mit diesem Versuch überprüft?',o:['Mehr Blätter verdunsten mehr Wasser.','Zweige wachsen in Wasser schneller.','Eine Ölschicht schadet den Zweigen.','Ohne Wurzel nimmt ein Zweig kein Wasser auf.'],c:0,tip:'Die Zylinder unterscheiden sich nur in der Zahl der Blätter. Also geht es darum, ob die Blätter die Wassermenge beeinflussen.'},
q_v2:{sec:'ver',t:'Wozu dient Messzylinder 1 ohne Pflanze?',o:['Er zeigt, ob Wasser ohne Pflanze verschwindet.','Er dient als Vorrat zum Nachfüllen der anderen.','Er zeigt, wie viel Öl die Zweige aufnehmen.','Er zeigt, wie schnell Öl im Licht verdunstet.'],c:0,tip:'Das ist der Kontrollansatz: Sinkt dort der Wasserstand nicht, dann liegt es in den anderen Zylindern wirklich an der Pflanze.'},
q_v3:{sec:'ver',t:'Warum wird eine Ölschicht auf das Wasser getropft?',o:['Damit kein Wasser direkt verdunstet.','Damit die Zweige leichter Wasser aufnehmen.','Damit das Wasser nicht schlecht wird und schimmelt.','Damit die Zweige zusätzliche Nährstoffe bekommen.'],c:0,tip:'Öl lässt kein Wasser durch. So kann Wasser nur noch über die Pflanze verschwinden, nicht über die Wasseroberfläche.'},
q_v4:{sec:'ver',t:'Was ist das Ergebnis des Versuchs?',o:['Mit vielen Blättern sinkt der Stand am meisten.','In allen Zylindern sinkt der Stand gleich stark.','Ohne Blätter sinkt der Wasserstand am meisten.','Ohne Pflanze sinkt der Wasserstand am meisten.'],c:0,tip:'Vergleiche die Höhe der Wassersäulen: Je mehr Blätter, desto mehr Wasser ist verschwunden, weil mehr verdunstet.'},
/* Kapitel 2 */
q_leben:{sec:'rz',t:'Eine Fliege berührt die Fühlborsten der Venusfliegenfalle und die Falle klappt zu. Welches Kennzeichen des Lebens zeigt die Pflanze dabei?',o:['Reizbarkeit','Fortpflanzung','Wachstum','Stoffwechsel'],c:0,exp:'Die Pflanze nimmt einen Reiz (Berührung) auf und reagiert darauf.',tip:'Das Verdauen später ist Stoffwechsel. Das Zuklappen selbst ist eine Reaktion auf einen Reiz (Berührung): Reizbarkeit.'},
q_rz1:{sec:'rz',t:'Womit nehmen Pflanzen Reize auf?',o:['Mit spezialisierten Zellen','Mit kleinen Sinnesorganen an den Blättern','Mit einem Nervensystem wie der Mensch','Gar nicht, Pflanzen spüren nichts'],c:0,tip:'Pflanzen haben keine Sinnesorgane und keine Nerven. Spezialisierte Zellen in bestimmten Bereichen übernehmen diese Aufgabe.'},
q_rz2:{sec:'rz',t:'Wie reagieren die meisten Pflanzen auf Reize?',o:['Meist langsam durch Wachstum','Blitzschnell wie die Venusfliegenfalle','Gar nicht, nur Tiere reagieren auf Reize','Mit Muskeln, die die Blätter bewegen'],c:0,tip:'Schnelle Bewegungen wie bei der Venusfliegenfalle sind selten. Meist ändert sich langsam die Wachstumsrichtung.'},
q_rz3:{sec:'rz',t:'Die Tulpe öffnet ihre Blüte erst, wenn es warm ist. Welche Bedeutung hat das?',o:['Fortpflanzung: Insekten fliegen bei Wärme.','Ernährung: Die Blüte macht dann Fotosynthese.','Schutz: So schützt sich die Blüte vor Hitze.','Wachstum: Die Blüte wird dadurch größer.'],c:0,tip:'Bestäubende Insekten sind nur bei Wärme unterwegs. Bei Kälte bleibt die Blüte zu und schützt ihre Fortpflanzungsorgane.'},
q_ft1:{sec:'ft',t:'Was bedeutet Fototropismus?',o:['Durch Licht ausgelöste Wachstumsbewegung','Herstellung von Zucker mithilfe von Licht','Schnelles Zuklappen der Blätter bei Berührung','Wachstum der Wurzel zur Schwerkraft hin'],c:0,exp:'photos = Licht, tropos = Wendung.',tip:'Nicht mit Fotosynthese verwechseln! „photos“ heißt Licht, „tropos“ heißt Wendung: Die Pflanze wendet sich durch Wachstum zum Licht.'},
q_ft2:{sec:'ft',t:'Welchen Vorteil hat es für die Pflanze, zum Licht zu wachsen?',o:['Mehr Licht für die Fotosynthese','Insekten finden die Pflanze besser.','Die Wurzel bekommt dadurch mehr Wasser.','Die Pflanze wird im Schatten nicht so heiß.'],c:0,tip:'Mehr Licht heißt mehr Fotosynthese, also mehr Zucker. Das ist eine Bedeutung für die Ernährung.'},
q_ft3:{sec:'ft',t:'Wo wird der Botenstoff Auxin gebildet?',o:['In der Sprossspitze','In der Wurzelspitze','In allen Blättern gleich','In der Blüte'],c:0,tip:'Die spezialisierten Zellen, die Licht wahrnehmen und Auxin bilden, sitzen ganz oben in der Sprossspitze.'},
q_ft4:{sec:'ft',t:'Licht kommt von rechts. Auf welcher Seite strecken sich die Zellen stärker?',o:['Links, auf der Schattenseite','Rechts, auf der Lichtseite','Auf beiden Seiten gleich stark','Gar nicht, nur die Spitze bewegt sich'],c:0,tip:'Auf der Schattenseite kommt mehr Auxin an. Dort strecken sich die Zellen stärker, deshalb krümmt sich der Spross zum Licht.'},
q_kc4:{sec:'ft',t:'Eine Zimmerpflanze steht am Fenster. Du drehst den Topf jeden Tag ein Stück. Was beobachtest du nach einigen Wochen?',o:['Sie wächst ziemlich gerade nach oben.','Sie krümmt sich immer stärker zum Fenster.','Sie wächst vom Fenster weg nach innen.','Sie hört auf zu wachsen, weil sie gestört wird.'],c:0,tip:'Weil das Licht jeden Tag von einer anderen Seite kommt, wechselt auch die Schattenseite. Die Krümmungen gleichen sich aus.'},
/* Zusatz (zählt nicht) */
z_lab:{sec:'z',t:'Wohin wachsen die Bohnenpflanzen im Labyrinth nach sieben Tagen?',o:['Um die Pappwände herum bis zum Loch','Gerade nach oben gegen den Deckel','Zur dunkelsten Ecke des Kartons','Gar nicht, im Dunkeln wächst nichts'],c:0,tip:'Licht kommt nur durch das Loch. Der Spross wächst immer zur hellsten Stelle und findet so den Weg um die Wände herum.'},
z_k1:{sec:'z',t:'Keimling a: Ein schwarzes Tütchen sitzt auf der Spitze. Was passiert bei Licht von der Seite?',o:['Er wächst gerade weiter.','Er krümmt sich zum Licht.','Er krümmt sich vom Licht weg.','Er wächst nicht mehr.'],c:0,tip:'Die Spitze nimmt den Lichtreiz wahr. Ist sie abgedeckt, „merkt“ der Keimling nicht, woher das Licht kommt.'},
z_k2:{sec:'z',t:'Keimling b: Die Spitze wurde abgeschnitten. Was passiert?',o:['Er krümmt sich nicht zum Licht.','Er krümmt sich besonders stark.','Er bildet sofort eine neue Spitze.','Er wächst zur Schattenseite.'],c:0,tip:'Ohne Spitze wird kein Auxin mehr gebildet. Ohne Auxin keine ungleiche Streckung und keine Krümmung.'},
z_k3:{sec:'z',t:'Keimling c: Ein schwarzes Röhrchen bedeckt den Stängel, die Spitze bleibt frei. Was passiert?',o:['Er krümmt sich zum Licht.','Er wächst gerade weiter.','Er krümmt sich vom Licht weg.','Er wächst nicht mehr.'],c:0,tip:'Die Spitze sieht das Licht noch. Sie verteilt das Auxin ungleich, der Stängel darunter krümmt sich trotzdem.'},
z_k4:{sec:'z',t:'Wozu dienen die fünf unbehandelten Keimlinge (d)?',o:['Kontrolle: Sie zeigen das normale Wachstum.','Ersatz, falls andere Keimlinge kaputtgehen','Sie sollen das Licht für die anderen abhalten.','Sie liefern Auxin für die anderen Keimlinge.'],c:0,tip:'Ohne Kontrollgruppe wüsste man nicht, ob die Keimlinge in diesem Karton überhaupt zum Licht wachsen.'},
z_sk1:{sec:'z',t:'Eine Pflanze wird im Dunkeln waagerecht hingelegt. Was beobachtest du nach ein paar Tagen?',o:['Spross wächst nach oben, Wurzel nach unten','Spross und Wurzel wachsen waagerecht weiter','Spross wächst nach unten, Wurzel nach oben','Beide wachsen nach oben zur Luft'],c:0,tip:'Im Dunkeln kann nur die Schwerkraft der Reiz sein. Die Wurzel wächst zur Schwerkraft hin, der Spross von ihr weg.'},
z_mim:{sec:'z',t:'Die Mimose klappt ihre Blätter in 0,08 Sekunden zusammen. Der Lidschlussreflex des Menschen braucht 0,25 Sekunden. Was stimmt?',o:['Die Mimose ist etwa dreimal so schnell.','Der Mensch ist etwa dreimal so schnell.','Beide sind ungefähr gleich schnell.','Die Mimose ist etwa dreißigmal so schnell.'],c:0,tip:'0,25 : 0,08 ≈ 3. Die Mimose ist also rund dreimal so schnell wie dein Lidschluss.'},
z_mim2:{sec:'z',t:'Welche Bedeutung hat das schnelle Zusammenklappen der Mimose?',o:['Schutz vor Fressfeinden','Ernährung durch Fotosynthese','Fortpflanzung durch Bestäubung','Wasser sparen in der Mittagshitze'],c:0,tip:'Ein Tier berührt das Blatt, die Blätter klappen zusammen und sehen plötzlich welk aus. Das schreckt Fressfeinde ab.'},
z_gb:{sec:'z',t:'Gänseblümchen werden in kaltes und in 30 °C warmes Wasser gestellt. Welche Hypothese passt zu diesem Versuch?',o:['Gänseblümchen öffnen sich bei Wärme weiter.','Gänseblümchen wachsen im Wasser zum Licht.','Gänseblümchen öffnen sich nur bei Berührung.','Gänseblümchen schließen sich bei Wärme.'],c:0,tip:'Der einzige Unterschied zwischen den Gläsern ist die Temperatur. Wie bei der Tulpe ist Wärme hier der Reiz.'},
z_rk:{sec:'z',t:'Was fehlt bei der Reiz-Reaktions-Kette der Pflanze im Vergleich zum Menschen?',o:['Die Verarbeitung im Gehirn','Die Aufnahme des Reizes in der Spitze','Die Weiterleitung einer Information','Die Reaktion, zum Beispiel eine Bewegung'],c:0,tip:'Auch bei der Pflanze wird ein Reiz aufgenommen, eine Information weitergeleitet (Auxin) und es gibt eine Reaktion. Ein Gehirn hat sie aber nicht.'}
};
var NACHLESEN={org:'Organe und ihre Aufgaben',tr:'Wasser hoch, Zucker runter',ver:'Diagramm und Versuch',rz:'Reize aus der Umwelt',ft:'Fototropismus'};

var G={

function game(id){var g=G[id];var st=S.game[id]||{v:{},tries:0,ok:0};var o=g.fixed?null:order(id,g.rows.length);

 for(var k=0;k<g.rows.length;k++){var r=o?o[k]:k;var row=g.rows[r];var allok=true,any=false;
  var cells='';for(var f2=0;f2<g.f.length;f2++){var key=r+'_'+f2;var v=st.v[key]||'';var co=row.a[f2];if(st.tries>0){any=true;if(v!==co)allok=false;}

{n:'Start',ch:1,m:3,h:function(){return '<h2>Willkommen! 🌱</h2><p>Dein Lehrer ist die nächsten beiden Doppelstunden nicht da. Mit diesem Lernpfad arbeitest du selbstständig weiter. Dein Fortschritt wird automatisch auf diesem Gerät gespeichert.</p>'+
 '<div class="info"><b>So arbeitest du:</b><ul><li><b>Kapitel 1 (Doppelstunde 1):</b> Die Pflanze als Organismus</li><li><b>Kapitel 2 (Doppelstunde 2):</b> Reizbarkeit von Pflanzen</li><li><b>⭐ Zusatz:</b> für alle, die früher fertig sind</li><li>Wenn du dich sicher fühlst: <b>mebis-Test</b> am Ende</li></ul>Alles mit 📓 schreibst du ins Heft ab. Fachwörter findest du oben im 📖 Wortspeicher.</div>'+
 '<div class="task"><b>Deine Lernziele:</b><ul><li>Ich kann die Grundorgane einer Samenpflanze benennen und ihre Aufgaben beschreiben.</li><li>Ich kann beschreiben, wie Wasser und Zucker in der Pflanze transportiert werden.</li><li>Ich kann ein Diagramm und einen Versuch zum Wassertransport auswerten.</li><li>Ich kann erklären, auf welche Reize Pflanzen reagieren und welche Bedeutung das hat.</li><li>Ich kann erklären, warum ein Spross zum Licht wächst (Fototropismus).</li></ul></div>'+
 check('start','Ich habe Heft, Stift und Buntstifte (blau, gelb, grün) bereitgelegt.');},g:function(){return S.ck.start;}},
{n:'Lebensaufgaben',ch:1,m:5,h:function(){return '<h2>Was jedes Lebewesen können muss</h2><div class="info">Jedes Lebewesen muss bestimmte Aufgaben meistern, um zu überleben. Der Mensch braucht Nährstoffe (dafür hat er den Verdauungsapparat), nimmt Reize wahr (Sinnesorgane, Nervensystem), braucht Stabilität (Knochen) und pflanzt sich fort (Fortpflanzungsorgane).<br><br><b>Auch Pflanzen müssen diese Lebensaufgaben meistern</b>, aber mit ganz anderen Organen.</div><div class="task">Überlege kurz: Welche Aufgaben hat eine Pflanze und welche Teile der Pflanze übernehmen sie? Danach beantworte die Frage.</div>'+quiz('q_naehr');},g:function(){return answered(['q_naehr']);}},
{n:'Organe und ihre Aufgaben',ch:1,m:7,h:function(){return '<h2>Der Grundbauplan einer Samenpflanze</h2>'+svgPlant()+
 '<div class="info">Die meisten Pflanzen haben den gleichen Grundbauplan aus <b>Wurzel</b>, <b>Sprossachse</b> und <b>Blättern</b>. Dazu kommen Blüten, Früchte und Samen.<ul>'+
 '<li><b>Wurzel:</b> Sie verankert die Pflanze im Boden. Über die feinen <b>Wurzelhaare</b> nimmt sie Wasser mit darin gelösten Mineralsalzen auf. Manche Wurzeln speichern Nährstoffe, z. B. die Karotte.</li>'+
 '<li><b>Sprossachse</b> (Stängel, bei Bäumen der Stamm): Sie trägt Blätter und Blüten und hebt die Blätter zum Licht. In ihr liegen Leitelemente, die Stoffe transportieren.</li>'+
 '<li><b>Blatt:</b> Jedes grüne Blatt ist eine „Nährstofffabrik“. Mit Licht stellt es durch Fotosynthese Zucker her.</li>'+
 '<li><b>Blüte:</b> Sie dient der Fortpflanzung. Nach der Bestäubung entstehen Frucht und Samen.</li></ul>Sprossachse und Blätter zusammen nennt man <b>Spross</b>.</div>'+
 '<div class="task"><b>Beschrifte:</b> Welches Organ hat welche Nummer?</div>'+game('g_label');},g:function(){return gameDone('g_label');}},
{n:'Frage: Aufgaben der Organe',ch:1,m:5,h:function(){return '<h2>Frage: Wer macht was?</h2>'+quiz('q_wurzel')+quiz('q_spross')+quiz('q_blatt')+quiz('q_bluete');},g:function(){return answered(['q_wurzel','q_spross','q_blatt','q_bluete']);}},
{n:'Was hast du gegessen?',ch:1,m:8,h:function(){return '<h2>Was hast du heute gegessen? 🍽️</h2><div class="info">Wir essen jeden Tag Pflanzenorgane, meistens ohne es zu merken. Ordne zu, welchen Pflanzenteil man jeweils isst. Vorsicht, es sind Fallen dabei!</div>'+game('g_essen')+(gameDone('g_essen')?'<div class="task">Überrascht? Die Kartoffel ist <b>keine Wurzel</b>, sondern ein verdickter Spross (Sprossknolle). Woran man das sieht: An den „Augen“ sitzen Knospen, aus denen neue Triebe wachsen.</div>':'');},g:function(){return gameDone('g_essen');}},
{n:'Wasser hoch, Zucker runter',ch:1,m:6,h:function(){return '<h2>Das Zusammenspiel der Organe</h2>'+svgSchema()+
 '<div class="info"><ul><li>An den Blättern <b>verdunstet</b> ständig Wasser. Dadurch entsteht ein <b>Sog</b>, ähnlich wie beim Trinken mit einem Strohhalm.</li><li>Dieser Sog zieht Wasser aus dem Boden in die Wurzelhaare und durch die Leitelemente der Sprossachse <b>nach oben</b> in die Blätter. Mit dem Wasser kommen die Mineralsalze mit.</li><li>In den Blättern entsteht durch Fotosynthese <b>Zucker</b>. Er wird in die <b>Gegenrichtung</b> zu den nicht grünen Teilen geleitet: Wurzel, Blüten und Früchte. Auch sie brauchen Energie, die sie über die Zellatmung aus dem Zucker gewinnen.</li></ul></div>';},g:function(){return true;}},

{n:'Hefteintrag 5',ch:1,m:12,h:function(){return '<h2>📓 Hefteintrag 5: Organe des Pflanzenkörpers</h2><div class="small">Du schreibst weiter unter der Überschrift „B Stoffwechsel von Pflanzen“ (nach Hefteintrag 4 Nachweisreaktionen).</div>'+heftBox('5 Organe des Pflanzenkörpers und ihre Aufgaben',

{n:'Diagramm und Versuch',ch:1,m:7,h:function(){return '<h2>Diagramm: Wasser über den Tag</h2><div class="info">Forscher haben an einem Sommertag gemessen, wie viel Wasser eine Pflanze pro Stunde aufnimmt und abgibt (verdunstet).</div>'+svgDiagram()+quiz('q_dia1')+quiz('q_dia2')+quiz('q_dia3');},g:function(){return answered(['q_dia1','q_dia2','q_dia3']);}},
{n:'Versuch: Messzylinder',ch:1,m:9,h:function(){return '<h2>Versuch: Welche Rolle spielen die Blätter?</h2><div class="info">In vier Messzylindern steht gleich viel Wasser. Auf das Wasser wurde vorsichtig eine dünne Schicht <b>Öl</b> getropft.<br>1: ohne Pflanze · 2: Zweig ohne Blätter · 3: Zweig mit wenigen Blättern · 4: Zweig mit vielen Blättern.<br>Die Abbildung zeigt die Wasserstände nach drei Tagen.</div>'+svgZyl()+quiz('q_v1')+quiz('q_v2')+quiz('q_v3')+quiz('q_v4');},g:function(){return answered(['q_v1','q_v2','q_v3','q_v4']);}},
{n:'Erfinde eine Pflanze',ch:1,m:15,h:function(){var h='<h2>Erfinde eine Pflanze! 🎨</h2><div class="info">Pflanzen sind an ihren Lebensraum angepasst. Der Kaktus speichert zum Beispiel Wasser in seinem dicken Spross. Jetzt erfindest du selbst eine Pflanze.</div>';

  check('zeich','Meine Pflanze ist im Heft gezeichnet und beschriftet.')+txt('t_erf',200,'Beispiel Wüste („Durstkugel“): <b>Wurzel:</b> sehr lang und weit verzweigt, weil sie so auch tief im Boden noch Wasser findet. <b>Sprossachse:</b> dick, weil sie Wasser für lange Trockenzeiten speichert. <b>Blatt:</b> sehr klein oder als Dornen, weil über kleine Blätter weniger Wasser verdunstet. <b>Blüte:</b> blüht nur kurz nach einem Regen, weil dann Insekten unterwegs sind und die Samen keimen können.');}

{n:'Kapitel 1 geschafft',ch:1,m:1,h:function(){return '<h2>🏁 Kapitel 1 geschafft!</h2><p>Super! Du kennst jetzt die Organe der Pflanze und weißt, wie Wasser und Zucker transportiert werden.</p><div class="info">Ist von der Doppelstunde noch Zeit übrig? Dann mach direkt mit <b>Kapitel 2</b> weiter. Sonst geht es nächstes Mal hier weiter, dein Fortschritt ist gespeichert.</div>';},g:function(){return true;}},
/* ===== KAPITEL 2 ===== */
{n:'Lebt die Falle?',ch:2,m:5,h:function(){return '<h2>Kapitel 2: Pflanzen reagieren auf ihre Umwelt</h2><div class="big">🪰 ➜ 🌿</div><div class="info">Die <b>Venusfliegenfalle</b> hat Fangblätter. Auf der Innenseite sitzen je drei feine Fühlborsten. Berührt eine Fliege zweimal eine Borste, klappt die Falle in Sekundenbruchteilen zu. Danach wird die Fliege verdaut. So bekommt die Pflanze Mineralsalze, die in ihrem Moorboden fehlen.</div><div class="task">Erinnere dich an die <b>Kennzeichen des Lebens</b>: besteht aus Zellen, Stoffwechsel, Reizbarkeit, Bewegung, Fortpflanzung, Wachstum.</div>'+quiz('q_leben');},g:function(){return answered(['q_leben']);}},
{n:'Reize aus der Umwelt',ch:2,m:5,h:function(){return '<h2>Reize: Informationen aus der Umwelt</h2><div class="info"><ul><li>Auch Pflanzen zeigen <b>Reizbarkeit</b>: Sie nehmen Informationen aus der Umwelt als <b>Reize</b> auf und reagieren darauf.</li><li>Solche Reize sind: <b>Licht, Wärme, Schwerkraft, Berührung</b> und <b>chemische Stoffe</b>.</li><li>Pflanzen haben keine Sinnesorgane wie der Mensch. Stattdessen nehmen <b>spezialisierte Zellen</b> in bestimmten Bereichen der Pflanze die Reize auf.</li><li>Pflanzen können nicht weglaufen. Sie reagieren meist <b>langsam durch Wachstum</b> in eine bestimmte Richtung. Manche zeigen auch schnelle Bewegungen, wie die Venusfliegenfalle.</li><li>Die Reaktionen haben eine <b>Bedeutung</b> für die <b>Ernährung</b>, die <b>Fortpflanzung</b> oder den <b>Schutz</b> der Pflanze.</li></ul></div>';},g:function(){return true;}},
{n:'Frage: Reize',ch:2,m:3,h:function(){return '<h2>Frage: Reize</h2>'+quiz('q_rz1')+quiz('q_rz2');},g:function(){return answered(['q_rz1','q_rz2']);}},
{n:'Reiz und Bedeutung',ch:2,m:12,h:function(){return '<h2>Reiz und Bedeutung zuordnen 🧩</h2><div class="info">Hier siehst du acht Bewegungen von Pflanzen. Ordne jeder Bewegung den <b>Reiz</b> zu, auf den sie reagiert, und die <b>Bedeutung</b>, die die Reaktion für die Pflanze hat. <br><span class="small">Lies dazu, falls vorhanden, im Buch S. 52/53.</span></div>'+game('g_reiz');},g:function(){return gameDone('g_reiz');}},

{n:'Hefteintrag C 1',ch:2,m:10,h:function(){return '<h2>📓 Hefteintrag C 1: Pflanzen nehmen ihre Umgebung wahr</h2>'+heftBox('<b style="font-size:1.1em">C Reizbarkeit von Pflanzen</b><br><small>Neues Oberkapitel! Schreibe diese Überschrift als Erstes in dein Heft.</small>','')+heftBox('1 Pflanzen nehmen ihre Umgebung wahr',
 '<ul style="margin:4px 0"><li>Pflanzen nehmen mit <b>spezialisierten Zellen</b> Reize auf und reagieren darauf (<b>Reizbarkeit</b>).</li><li>Reize: Licht, Wärme, Schwerkraft, Berührung, chemische Stoffe</li><li>Reaktion meist langsam durch Wachstum, selten schnell (Venusfliegenfalle)</li></ul>'+
 '<table><tr><th>Bewegung</th><th>Reiz</th><th>Bedeutung für</th></tr><tr><td>Fangblatt klappt zu</td><td>Berührung</td><td>Ernährung</td></tr><tr><td>Spross wächst zum Licht</td><td>Licht</td><td>Ernährung</td></tr><tr><td>Tulpe öffnet die Blüte</td><td>Wärme</td><td>Fortpflanzung</td></tr><tr><td>Mimose klappt Blätter zusammen</td><td>Berührung</td><td>Schutz</td></tr></table>')+check('h4','Ich habe die Überschrift C und Hefteintrag 1 abgeschrieben.');},g:function(){return S.ck.h4;}},
{n:'Fototropismus',ch:2,m:4,h:function(){return '<h2>Warum schauen Sonnenblumen zur Sonne? 🌻</h2><div class="info">Auf einem Sonnenblumenfeld zeigen die Blüten morgens nach Osten, mittags nach Süden und abends nach Westen. Eine Zimmerpflanze auf der Fensterbank krümmt sich mit der Zeit zum Fenster.<br><br>Diese durch Licht ausgelöste Wachstumsbewegung heißt <b>Fototropismus</b> (griechisch: <i>photos</i> = Licht, <i>tropos</i> = Wendung).</div>'+quiz('q_ft1')+quiz('q_ft2');},g:function(){return answered(['q_ft1','q_ft2']);}},
{n:'Spiel 1: Spross beobachten',ch:2,m:12,h:function(){var p=S.sp;var h='<h2>Spiel 1: Lass den Spross wachsen 🌱</h2><div class="info">Der Spross besteht aus Zellen. Die <span style="color:#1f5fbf"><b>linke Seite ist blau</b></span>, die <span style="color:#e07a00"><b>rechte Seite orange</b></span> markiert, die Spitze ist dunkelgrün. Unten zeigen zwei Balken, wie lang die beiden Seiten sind (wie die Wollfäden beim Modell).<br><b>Probiere aus:</b> Licht von oben und Licht von rechts, jeweils „Wachsen lassen“.</div>';
 h+='<div>Licht kommt von: <button class="btn '+(p.light==='oben'?'on':'sec')+'" data-sp="oben">⬇️ oben (A)</button><button class="btn '+(p.light==='rechts'?'on':'sec')+'" data-sp="rechts">⬅️ rechts (B)</button><button class="btn '+(p.light==='links'?'on':'sec')+'" data-sp="links">➡️ links</button></div>';
 h+='<button class="btn" data-sp="grow" style="background:#1e6fd9">🌱 Wachsen lassen</button> <button class="btn sec" data-sp="reset">↩️ zurücksetzen</button>'+svgSpross(p.light,p.grown);
 var sn=p.seen||{};h+='<div class="small">Beobachtet: '+(sn.oben?'✅':'⬜')+' Licht von oben · '+(sn.rechts?'✅':'⬜')+' Licht von rechts</div>';
 if(sn.oben&&sn.rechts)h+='<h3>Was hast du beobachtet?</h3><div class="task">Vergleiche immer die <b>blaue</b> mit der <b>orangen</b> Seite: Schau dir dazu die beiden Balken unter dem Spross an.</div>'+game('g_tab')+(gameDone('g_tab')?'<div class="info"><b>So schreibst du es aufs Arbeitsblatt:</b> „beide gleich viel“ = <b>gleichmäßig</b>, „eine Seite mehr“ = <b>ungleichmäßig</b>, „genauso lang“ = <b>gleich lang</b>.</div>':'');
 return h;},g:function(){var sn=S.sp.seen||{};return sn.oben&&sn.rechts&&gameDone('g_tab');}},
{n:'Wie entsteht die Krümmung?',ch:2,m:5,h:function(){return '<h2>Wie reagiert der Spross auf den Lichteinfall?</h2><div class="info"><ul><li><b>Spezialisierte Zellen in der Sprossspitze</b> nehmen den Lichtreiz wahr. Sie bilden den Botenstoff <b>Auxin</b>.</li><li>Das Auxin wird von der Spitze nach unten in den Spross transportiert.</li><li>Auxin bewirkt, dass sich Zellen <b>strecken</b>: Zellen mit viel Auxin werden länger als Zellen mit wenig Auxin.</li><li><b>Licht von oben:</b> Auf beiden Seiten kommt gleich viel Auxin an. Beide Seiten wachsen gleich stark, der Spross wächst gerade.</li><li><b>Licht von der Seite:</b> Auf der <b>Schattenseite</b> kommt <b>mehr</b> Auxin an, auf der <b>Lichtseite weniger</b>. Die Zellen der Schattenseite strecken sich stärker. Der Spross <b>krümmt sich zum Licht</b>.</li></ul></div>'+quiz('q_ft3')+quiz('q_ft4');},g:function(){return answered(['q_ft3','q_ft4']);}},
{n:'Spiel 2: Auxin-Kärtchen',ch:2,m:10,h:function(){return '<h2>Spiel 2: Lege die Auxin-Kärtchen 🃏</h2><div class="info">Lege für beide Sprosse fest, wie viel Auxin auf jeder Seite transportiert wird (roter Pfeil: dünn = wenig, dick = viel) und welche Zellen dadurch entstehen. Die Grafik zeigt sofort, was du gelegt hast.</div>'+svgAux(S.game.g_aux)+game('g_aux');},g:function(){return gameDone('g_aux');}},
{n:'Arbeitsblatt (Hefteintrag C 1.1)',ch:2,m:12,h:function(){var h='<h2>Arbeitsblatt „Wie reagieren Pflanzen auf Licht?“ 📄</h2><div class="task"><b>Hol dir das Arbeitsblatt</b> bei der Lehrkraft und klebe es als <b>Hefteintrag 1.1</b> (unter C Reizbarkeit von Pflanzen) ins Heft.<ol><li>Schreibe in die Zeilen oben eine Erklärung, was Fototropismus ist (mit Wortherkunft).</li><li>Zeichne in Abbildung 2 die linke Sprossseite blau, die rechte orange und die Spitze schwarz ein.</li><li>Fülle links die Tabelle aus (wie in Spiel 1).</li><li>Fülle rechts die Tabelle zur Abbildung 3 aus (Nr. 1 bis 7, wie in Spiel 2).</li></ol></div>'+check('ab','Ich habe das Arbeitsblatt vollständig ausgefüllt und eingeklebt.');
 if(S.ck.ab)h+='<div class="sample"><b>Lösung zum Vergleichen</b> (verbessere mit grünem Stift):<br><b>Oben:</b> Fototropismus ist eine durch Licht ausgelöste Wachstumsbewegung. photos = Licht, tropos = Wendung.<br><b>Tabelle links:</b> Lichteinfall: A gleichmäßig, B ungleichmäßig · linke Sprossseite: A gleich lang, B länger · rechte Sprossseite: A gleich lang, B kürzer.<br><b>Tabelle rechts:</b> 1 auxinproduzierende Zellen (Sprossspitze) · 2 mittel · 3 viel · 4 wenig · 5 mittlere Zellen · 6 gestreckte (lange) Zellen · 7 kurze Zellen</div>'+check('abk','Ich habe mein Arbeitsblatt mit der Lösung verglichen und verbessert.');
 return h;},g:function(){return S.ck.ab&&S.ck.abk;}},
{n:'Kurzcheck 3',ch:2,m:3,h:function(){return '<h2>Kurzcheck ✔️</h2>'+quiz('q_kc4')+ampel('a3');},g:function(){return answered(['q_kc4'])&&S.amp.a3;}},
{n:'Auswertung',ch:2,m:5,h:function(){var secs={},k;for(k in Q){var q=Q[k];if(q.sec==='z')continue;if(!secs[q.sec])secs[q.sec]={r:0,n:0};secs[q.sec].n++;if(S.ans[k]===q.c)secs[q.sec].r++;}
 var tot=0,tr=0,worst=null,wv=2;var h='<h2>Deine Auswertung 📊</h2><table class="tbl"><tr><th>Thema</th><th>richtig</th><th></th></tr>';
 for(k in NACHLESEN){var s=secs[k];if(!s)continue;tot+=s.n;tr+=s.r;var v=s.r/s.n;if(v<wv){wv=v;worst=k;}
  h+='<tr><td>'+NACHLESEN[k]+'</td><td>'+s.r+' von '+s.n+'</td><td>'+(v<1?'<button class="btn sec" data-jump="'+k+'">🔎 Zum Nachlesen</button>':'✅')+'</td></tr>';}
 h+='</table><p><b>Gesamt: '+tr+' von '+tot+' Fragen beim ersten Versuch richtig.</b></p>';
 if(worst&&wv<1)h+='<div class="fb no">Am meisten Übung brauchst du noch bei: <b>'+NACHLESEN[worst]+'</b>. Lies dort noch einmal nach, bevor du den mebis-Test machst.</div>';else h+='<div class="fb ok">Stark, alles richtig!</div>';
 var am={g:0,y:0,r:0};['a1','a2','a3'].forEach(function(x){if(S.amp[x])am[S.amp[x]]++;});h+='<div class="small">Deine Selbsteinschätzung: 🟢 '+am.g+' · 🟡 '+am.y+' · 🔴 '+am.r+'</div>';return h;},g:function(){return true;}},
{n:'Ziel: mebis-Test',ch:2,m:12,h:function(){return '<h2>🎯 Geschafft!</h2><div class="info">Wenn du dich sicher fühlst, mach jetzt den <b>mebis-Test</b>:<br>mebis öffnen → Kurs <b>Natur und Technik</b> → Test <b>„Pflanze als Organismus und Reizbarkeit“</b>.<br>Du kannst ihn nur einmal abgeben. Schau vorher noch einmal in deine Hefteinträge B 5, C 1 und C 1.1.</div>'+check('test','Ich habe den mebis-Test abgegeben.')+'<div class="task">Danach geht es mit den ⭐ <b>Zusatzaufgaben</b> weiter.</div>';},g:function(){return S.ck.test;}},
/* ===== ZUSATZ ===== */
{n:'Zusatz: Labyrinth',ch:3,m:15,h:function(){return '<h2>Entkommen Pflanzen dem Labyrinth?</h2><div class="info">In einem Schuhkarton stehen zwei Pappwände. In einer Ecke steht ein Topf mit Bohnensämlingen, in der gegenüberliegenden Ecke ist ein kleines Loch im Deckel. Sonst ist der Karton dunkel. Die Erde wird jeden Tag gegossen.</div>'+svgLab()+quiz('z_lab')+
 '<div class="task"><b>Skizzen ins Heft:</b> Zeichne vier kleine Skizzen des Kartons: Wie weit sind die Bohnen am <b>1., 3., 5. und 7. Tag</b> gewachsen?</div>'+check('zlab','Meine vier Skizzen sind fertig.')+'<h3>Richtig oder falsch?</h3>'+game('g_lab')+'<div class="task"><b>Beschreibe</b> die biologische Bedeutung dieser Reaktion für die Pflanze.</div>'+txt('t_lab',120,'Die Bohnen wachsen zum Loch, weil nur dort Licht hereinkommt (Fototropismus). Für die Pflanze ist das wichtig, weil sie Licht für die Fotosynthese braucht. Nur mit Licht kann sie Zucker herstellen und überleben.');},g:function(){return true;}},
{n:'Zusatz: Wo sitzt der Lichtsensor?',ch:3,m:15,h:function(){return '<h2>Versuch: Welche Bedeutung hat die Keimspitze?</h2><div class="info">Haferkeimlinge (ca. 3 cm) werden in einen dunklen Karton gestellt, der nur an einer Seite ein Loch hat. Vorher werden sie so behandelt:<br><b>a)</b> Ein schwarzes Tütchen sitzt auf der Spitze.<br><b>b)</b> Die Spitze (3 mm) wird abgeschnitten.<br><b>c)</b> Ein schwarzes Röhrchen bedeckt den Stängel, die Spitze bleibt frei.<br><b>d)</b> Keine Behandlung.<br><br>Sage voraus, was nach 5 bis 6 Stunden passiert.</div>'+quiz('z_k1')+quiz('z_k2')+quiz('z_k3')+quiz('z_k4')+
 '<div class="task"><b>Erkläre</b> mit dem Ergebnis: Wo nimmt der Keimling den Lichtreiz auf?</div>'+txt('t_keim',100,'Nur die Keimlinge, deren Spitze Licht abbekommt (c und d), krümmen sich zum Licht. Ist die Spitze abgedeckt oder abgeschnitten (a und b), wächst der Keimling gerade. Der Lichtreiz wird also in der Spitze aufgenommen, dort wird auch das Auxin gebildet.');},g:function(){return true;}},
{n:'Zusatz: Schwerkraft',ch:3,m:15,h:function(){return '<h2>Oben und unten: die Schwerkraft</h2><div class="info">Legt man eine junge Pflanze waagerecht hin, verändert sie nach einigen Tagen ihre Wachstumsrichtung. Diese Reaktion auf die Schwerkraft heißt <b>Gravitropismus</b>.</div>'+quiz('z_sk1')+
 '<div class="task"><b>Plane einen Versuch:</b> Du willst herausfinden, ob sich ein liegender Spross wegen des <b>Lichts</b> oder wegen der <b>Schwerkraft</b> nach oben krümmt. Beschreibe Versuchsaufbau, Kontrolle und das Ergebnis, das du erwartest.</div>'+txt('t_sk',150,'Ich lege zwei gleiche Pflanzen waagerecht hin. Pflanze 1 steht im Licht von oben, Pflanze 2 steht in einem völlig dunklen Karton. Sonst ist alles gleich (gleiche Erde, gleich viel Wasser, gleiche Temperatur). Krümmt sich auch der Spross im Dunkeln nach oben, dann ist die Schwerkraft der Reiz und nicht das Licht. Zur Kontrolle stelle ich eine dritte Pflanze ganz normal aufrecht in den dunklen Karton.');},g:function(){return true;}},
{n:'Zusatz: Schnelle Pflanzen',ch:3,m:10,h:function(){return '<h2>Blitzschnelle Pflanzen ⚡</h2><div class="info">Die <b>Mimose</b> faltet ihre Fiederblätter bei Berührung in nur 0,08 Sekunden zusammen und senkt den Blattstiel. Danach sieht sie welk aus. Nach etwa einer Viertelstunde richtet sie sich wieder auf.</div>'+quiz('z_mim')+quiz('z_mim2')+
 '<div class="task"><b>Krokus:</b> Morgens wachsen beim Krokus nur die Zellen an der Innenseite der Blütenblätter, abends nur die an der Außenseite. Beschreibe, wie sich die Blüte morgens und abends bewegt, und begründe, warum diese Bewegung langsamer ist als die der Mimose.</div>'+txt('t_kro',120,'Morgens werden die Zellen innen länger, dadurch biegen sich die Blütenblätter nach außen und die Blüte öffnet sich. Abends wachsen die Zellen außen, die Blütenblätter biegen sich nach innen und die Blüte schließt sich. Das ist langsamer als bei der Mimose, weil es durch Wachstum der Zellen passiert, und Wachstum braucht Zeit.');},g:function(){return true;}},
{n:'Zusatz: Gänseblümchen',ch:3,m:10,h:function(){return '<h2>Reagieren Gänseblümchen auf Wärme? 🌼</h2><div class="info">Zwei Reagenzgläser mit Gänseblümchen stehen in Bechergläsern. Glas 1 steht in kaltem Wasser, Glas 2 in Wasser mit 30 °C. Nach 30 Minuten werden die Blüten verglichen. Dann werden die Blütenköpfe getauscht und nach weiteren 30 Minuten erneut verglichen.</div>'+quiz('z_gb')+
 '<div class="task"><b>Begründe:</b> Warum werden die Blüten am Ende getauscht? Was würdest du nach dem Tausch erwarten, wenn deine Hypothese stimmt?</div>'+txt('t_gb',100,'Durch den Tausch prüft man, ob es wirklich an der Temperatur liegt und nicht an den einzelnen Blüten. Stimmt die Hypothese, öffnen sich die Blüten, die vorher im Kalten waren, jetzt im Warmen. Die vorher offenen Blüten schließen sich im Kalten.');},g:function(){return true;}},
{n:'Zusatz: Mensch und Pflanze',ch:3,m:10,h:function(){return '<h2>Reiz-Reaktions-Kette: Mensch und Pflanze</h2><div class="info"><b>Beim Menschen:</b> Reiz → Aufnahme im Sinnesorgan → Weiterleitung über Nerven → Verarbeitung in Gehirn und Rückenmark → Weiterleitung über Nerven → Reaktion im Muskel (Bewegung).<br><br><b>Beim Fototropismus:</b> Licht → Aufnahme in spezialisierten Zellen der Sprossspitze → Weiterleitung durch Auxin → Streckung der Zellen auf der Schattenseite (Krümmung).</div>'+quiz('z_rk')+
 '<div class="task"><b>Stelle beide Ketten im Heft als Tabelle nebeneinander</b> (Spalten: Schritt, Mensch, Pflanze) und schreibe darunter in zwei Sätzen, warum die Reaktion der Pflanze viel langsamer ist.</div>'+check('zrk','Meine Tabelle ist fertig.')+'<div class="info">🎉 Du hast alle Zusatzaufgaben geschafft! Wenn noch Zeit ist: Blättere deine Hefteinträge durch und erkläre deinem Sitznachbarn mit dem Schema aus Hefteintrag 5, wie Wasser und Zucker in der Pflanze wandern.</div>';},g:function(){return true;}}
];
var CHN={1:'Kapitel 1: Die Pflanze als Organismus',2:'Kapitel 2: Reizbarkeit von Pflanzen',3:'⭐ Zusatzaufgaben (freiwillig)'};
var WS=[['Wurzel','verankert die Pflanze und nimmt Wasser mit Mineralsalzen auf'],['Wurzelhaare','feine Härchen an der Wurzel, über die Wasser aufgenommen wird'],['Sprossachse','Stängel oder Stamm; trägt Blätter und Blüten und leitet Stoffe'],['Spross','Sprossachse und Blätter zusammen'],['Leitelemente','„Leitungen“ in der Pflanze, in denen Wasser und Zucker transportiert werden'],['Mineralsalze','im Wasser gelöste Stoffe aus dem Boden, die die Pflanze zum Wachsen braucht'],['Fotosynthese','Im grünen Blatt entsteht mit Licht aus Wasser und Kohlenstoffdioxid Zucker (und Sauerstoff).'],['Verdunstung','Wasser geht an den Blättern als Wasserdampf in die Luft; das erzeugt einen Sog'],['Sprossknolle','verdickter Spross, der Nährstoffe speichert (z. B. Kartoffel)'],['Hypothese','begründete Vermutung, die mit einem Versuch überprüft wird'],['Kontrollansatz','Versuchsteil ohne den untersuchten Faktor; zum Vergleich'],['Reiz','Information aus der Umwelt, z. B. Licht, Wärme, Schwerkraft, Berührung'],['Reizbarkeit','Fähigkeit, Reize aufzunehmen und darauf zu reagieren; Kennzeichen des Lebens'],['Fototropismus','durch Licht ausgelöste Wachstumsbewegung (photos = Licht, tropos = Wendung)'],['Auxin','Botenstoff aus der Sprossspitze; bewirkt, dass sich Zellen strecken'],['Streckungswachstum','Zellen werden länger; mehr Auxin = stärkere Streckung'],['Gravitropismus','durch die Schwerkraft ausgelöste Wachstumsbewegung (Zusatz)']];
function stepIndexByName(n){for(var i=0;i<STEPS.length;i++)if(STEPS[i].n===n)return i;return 0;}
function chMin(ch){var m=0;for(var i=0;i<STEPS.length;i++)if(STEPS[i].ch===ch)m+=STEPS[i].m;return m;}
function renderView(){var st=STEPS[S.cur];var h='<div class="card"><span class="tag'+(st.ch===3?' z':'')+'">'+CHN[st.ch]+' · ca. '+st.m+' Min.</span>'+st.h()+'</div>';
 document.getElementById('app').innerHTML=h;
 var pflicht=0;for(var i=0;i<STEPS.length;i++)if(STEPS[i].ch<3)pflicht++;
 var pct=Math.min(100,Math.round(Math.min(S.max,pflicht-1)/(pflicht-1)*100));document.getElementById('pbar').style.width=pct+'%';
 document.getElementById('meta').textContent='Schritt '+(S.cur+1)+' von '+STEPS.length+' · '+st.n;
 updNav();renderOv();}
function updNav(){var st=STEPS[S.cur];var ok=!!st.g();var nb=document.getElementById('nextBtn');var last=S.cur>=STEPS.length-1;
 nb.disabled=!ok||last;nb.textContent=last?'Ende':'Weiter ▶';document.getElementById('hint').textContent=ok?'':'Erledige die Aufgaben oder springe über 📋 Übersicht.';
 document.querySelector('[data-act="back"]').disabled=S.cur===0;}
function render(){renderView();save();}
function renderOv(){var o=document.getElementById('ov');if(UI.ws){var h='<div class="overlay" data-act="close"><div class="card"><h2>📖 Wortspeicher</h2><dl>';for(var i=0;i<WS.length;i++)h+='<dt>'+WS[i][0]+'</dt><dd>'+WS[i][1]+'</dd>';o.innerHTML=h+'</dl><button class="btn" data-act="close">Schließen</button></div></div>';}
 else if(UI.toc){var t='<div class="overlay" data-act="close"><div class="card"><h2>📋 Übersicht: Springe direkt zu jeder Seite</h2>';
  t+='<div class="task"><b>🎯 Schnell wiederholen</b> (z. B. vor dem Test):<br>';var QK=['Hefteintrag 5','Hefteintrag C 1','Arbeitsblatt (Hefteintrag C 1.1)','Kurzcheck 1','Kurzcheck 2','Kurzcheck 3','Spiel 1: Spross beobachten','Spiel 2: Auxin-Kärtchen','Auswertung'];
  for(var q=0;q<QK.length;q++)t+='<button class="btn sec" data-goto="'+stepIndexByName(QK[q])+'">'+QK[q]+'</button>';t+='</div><div class="toc">';var lc=0;for(var j=0;j<STEPS.length;j++){if(STEPS[j].ch!==lc){lc=STEPS[j].ch;t+='<h3 style="margin:10px 0 4px">'+CHN[lc]+' (ca. '+chMin(lc)+' Min.)</h3>';}
  t+='<a data-goto="'+j+'">'+(j===S.cur?'▶ ':'')+((j<S.max||(j===S.max&&STEPS[j].g()))?'✅ ':'⬜ ')+STEPS[j].n+'</a>';}
  o.innerHTML=t+'</div><button class="btn" data-act="close">Schließen</button> <button class="btn sec" data-act="reset">🔄 Neu starten</button></div></div>';}
 else o.innerHTML='';}
document.addEventListener('click',function(e){var t=e.target;while(t&&t!==document&&!(t.dataset&&(t.dataset.q||t.dataset.act||t.dataset.amp||t.dataset.gcheck||t.dataset.gsolve||t.dataset.sim||t.dataset.sp||t.dataset.lr||t.dataset.sample||t.dataset.jump||t.dataset.goto)))t=t.parentNode;
 if(!t||t===document||!t.dataset)return;var d=t.dataset;
 if(d.act){if(d.act==='close'&&t!==e.target&&t.classList.contains('overlay'))return;
  if(d.act==='next'){if(STEPS[S.cur].g()&&S.cur<STEPS.length-1){S.cur++;if(S.cur>S.max)S.max=S.cur;render();window.scrollTo(0,0);}return;}
  if(d.act==='back'){if(S.cur>0){S.cur--;render();window.scrollTo(0,0);}return;}
  if(d.act==='ws'){UI.ws=1;UI.toc=0;renderOv();return;}if(d.act==='toc'){UI.toc=1;UI.ws=0;renderOv();return;}
  if(d.act==='close'){UI.ws=0;UI.toc=0;renderOv();return;}
  if(d.act==='reset'){if(confirm('Wirklich alles löschen und von vorne beginnen?')){try{localStorage.removeItem(KEY);}catch(x){}S=fresh();UI.toc=0;render();window.scrollTo(0,0);}return;}}
 if(d.goto!==undefined){S.cur=parseInt(d.goto,10);UI.toc=0;render();window.scrollTo(0,0);return;}
 if(d.q){if(S.ans[d.q]===undefined){S.ans[d.q]=parseInt(d.i,10);render();}return;}
 if(d.amp){S.amp[d.amp]=d.v;render();return;}
 if(d.gcheck){gameCheck(d.gcheck);render();return;}
 if(d.gsolve){gameSolve(d.gsolve);render();return;}
 if(d.sim){var s=S.sim;if(d.sim==='run'){s.run=1;var off=(s.l?0:1)+(s.h?0:1)+(s.s?0:1);if(off===1){if(!s.l)s.tried.l=1;if(!s.h)s.tried.h=1;if(!s.s)s.tried.s=1;}}else{s[d.sim]=s[d.sim]?0:1;s.run=0;}render();return;}
 if(d.sp){var p=S.sp;if(d.sp==='grow'){p.grown=1;p.seen[p.light]=1;}else if(d.sp==='reset'){p.grown=0;}else{p.light=d.sp;p.grown=0;}render();return;}
 if(d.lr){if(S.lr===null||S.lr===undefined){S.lr=Math.floor(Math.random()*LR.length);}render();return;}
 if(d.sample){S.vert['s_'+d.sample]=1;render();return;}
 if(d.jump){S.cur=stepIndexByName(NACHLESEN[d.jump]);render();window.scrollTo(0,0);return;}
});
document.addEventListener('change',function(e){var t=e.target;if(!t.dataset)return;
 if(t.dataset.ck){S.ck[t.dataset.ck]=t.checked?1:0;render();return;}
 if(t.dataset.g){var id=t.dataset.g;var st=S.game[id]||{v:{},tries:0,ok:0};st.v[t.dataset.k]=t.value;S.game[id]=st;if(id==='g_aux'){render();}else{save();}return;}});
document.addEventListener('input',function(e){var t=e.target;if(!t.dataset||!t.dataset.tr)return;var id=t.dataset.tr,min=parseInt(t.dataset.min,10);S.tr[id]=t.value;
 var c=document.getElementById('cnt_'+id);if(c)c.textContent=t.value.length+' von mindestens '+min+' Zeichen';
 var sm=document.getElementById('smp_'+id);if(sm){var has=sm.innerHTML!=='';if(t.value.length>=min&&!has)sm.innerHTML=sampleHtml(id,SAMPLES[id]);if(t.value.length<min&&has&&!S.vert['s_'+id])sm.innerHTML='';}
 updNav();saveSoon();});
load();render();
</script></body></html>
